apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ever-gauzy
  description: >-
    Ever Gauzy is an open-source, full-stack enterprise resource planning (ERP), 
    customer relationship management (CRM), human resource management (HRM), and time tracking 
    platform. Features activity screenshot logging, employee monitoring, productivity analytics, 
    invoicing, bi-directional GitHub issues/PR synchronization, and role-based access control (RBAC). 
    Built with NestJS, Angular, TypeScript, PostgreSQL/SQLite, and TypeORM.
  annotations:
    github.com/project-slug: 'umeshudayan000/ever-gauzy'
    backstage.io/techdocs-ref: dir:.
  tags:
    - typescript
    - nestjs
    - angular
    - erp
    - crm
    - hrm
    - time-tracking
    - github-sync
    - productivity
spec:
  type: service
  lifecycle: experimental
  owner: user:default/guest
